openapi: 3.2.0
info:
  title: Copernicus Data Space Ecosystem (CDSE) asset-level STAC…
  description: A comprehensive and searchable catalog of Earth observation and scientific datasets that is actively maintained and updated by the Copernicus Data Space Ecosystem.
  version: 1.1.0
servers:
- url: /v1
tags:
- name: Filter Extension
paths:
  /queryables:
    get:
      tags:
      - Filter Extension
      summary: Queryables
      description: Endpoint.
      operationId: Queryables_queryables_get
      responses:
        '200':
          description: Successful Response
          content:
            application/schema+json:
              schema: {}
  /collections/{collection_id}/queryables:
    get:
      tags:
      - Filter Extension
      summary: Collection Queryables
      description: Endpoint.
      operationId: Collection_Queryables_collections__collection_id__queryables_get
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          description: Collection ID
          title: Collection Id
        description: Collection ID
      responses:
        '200':
          description: Successful Response
          content:
            application/schema+json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
